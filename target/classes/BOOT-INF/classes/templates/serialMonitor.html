<script type="text/javascript" th:inline="javascript">
    /*<![CDATA[*/
    var zh = /*[[ @{/json/zh.json} ]]*/ '/json/zh.json';
    /*]]>*/

    let host = document.location.host;

    function returnKeyData() {
        $.ajaxSettings.async = false;

        $.post("http://" + host + "/returnTrendChart",
            "monitorName=" + $("#monitorNameSelect").val() + "&keys=" + $("#keysSelect").val(),
            function (result) {
                var obj = result; // 已经是对象，无需解析

                if (obj.qqq != null) {
                    confirm(obj.qqq);
                }

                if ($('#lineChart').length) {
                    var ctx = document.getElementById("lineChart").getContext("2d");

                    var lineChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: obj.numsTime,
                            datasets: [
                                {
                                    label: "数值参数值",
                                    backgroundColor: "rgba(38, 185, 154, 0.31)",
                                    borderColor: "rgba(38,185,154,0.76)",
                                    pointBorderColor: "rgba(38, 185, 154, 0.7)",
                                    pointBackgroundColor: "rgba(38, 185, 154, 0.7)",
                                    pointHoverBackgroundColor: "#fff",
                                    pointHoverBorderColor: "rgba(220,220,220,1)",
                                    pointBorderWidth: 1,
                                    data: obj.numsData
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false
                        }
                    });
                }
            }
        );
        $.ajaxSettings.async = true;
    }

    function returnKeyData2() {
        $.ajaxSettings.async = false;
        // 重定向

        $.post("http://" + host + "/pollutionAlarm", "&key=" + $("#keysSelect2").val(), function (result) {
            var obj = result; // 已经是对象，无需解析
            if (obj.qqq != null) {
                confirm(obj.qqq);
            } else {
                window.location.replace("http://" + host + "/pollutionMonitor?key=" + $("#keysSelect2").val());
            }
        });

        $.ajaxSettings.async = true;
    }

    function callMonitorName() {
        $.ajaxSettings.async = false;
        $.post("http://" + host + "/returnPollutionMonitorName", "", function (result) {
            $("#monitorNameSelect").empty();
            for (var i = 0; i < result.length; i++) {
                $("#monitorNameSelect").append("<option value='" + result[i] + "'>" + result[i] + "</option>");
            }
        });
        $.ajaxSettings.async = true;
    }

    function callModelDateDirs(){
        $.ajaxSettings.async = false;
        $.post("http://" + host + "/returnSerialFileList", "monitorName=" + $("#monitorNameSelect").val(), function (result) {
            $("#modelNameSelect").empty();
            for (var i = 0; i < result.length; i++) {
                $("#modelNameSelect").append("<option value='" + result[i] + "'>" + result[i] + "</option>");
            }
        });
        $.ajaxSettings.async = true;
    }

    function callDateDirs() {
        $.ajaxSettings.async = false;
        $.post("http://" + host + "/returnModelFileList", "monitorName=" + $("#monitorNameSelect").val() +"&modelName=" + $("#modelNameSelect").val(),function (result) {
            $("#dateDirSelect").empty();
            for (var i = 0; i < result.length; i++) {
                $("#dateDirSelect").append("<option value='" + result[i] + "'>" + result[i] + "</option>");
            }
        });
        $.ajaxSettings.async = true;
    }



    function callPollutionData(cnt) {
        console.log("monitorName=" + $("#monitorNameSelect").val());
        console.log("modelName=" + $("#modelNameSelect").val());
        console.log("dir=" + $("#dateDirSelect").val());

        // 显示加载指示器
        if (cnt !== 1) {
            $('#tablesContainer').html('<div class="text-center"><i class="fa fa-spinner fa-spin fa-3x fa-fw"></i><span class="sr-only">加载中...</span></div>');
        }

        $.ajax({
            url: "http://" + host + "/returnSerialData",
            type: "POST",
            data: {
                monitorName: $("#monitorNameSelect").val(),
                modelName: $("#modelNameSelect").val(),
                dir: $("#dateDirSelect").val(),
                keys: $("#keysSelect").val()
            },
            dataType: "json", // 确保 jQuery 以 JSON 形式解析响应
            success: function(result) {
                try {
                    var obj = result; // 已经是对象，无需解析

                    // 清空之前的表格
                    if (cnt !== 1) {
                        $('#tablesContainer').empty();
                    }

                    // 遍历每个 parameterType，创建对应的表格
                    for (var parameterType in obj) {
                        if (obj.hasOwnProperty(parameterType)) {
                            var dataSet = obj[parameterType];
                            createDatatable(parameterType, dataSet, host, zh);
                        }
                    }
                } catch (e) {
                    console.error("处理数据失败:", e);
                    alert("数据处理错误。");
                    $('#tablesContainer').empty(); // 清空加载指示器
                }
            },
            error: function(jqXHR, textStatus, errorThrown) {
                console.error("请求失败: " + textStatus + ", " + errorThrown);
                alert("获取数据失败，请稍后重试。");
                $('#tablesContainer').empty(); // 清空加载指示器
            }
        });
    }
    function createDatatable(parameterType, dataSet, host, zh) {
        // 为每个表格创建一个唯一的ID
        var tableId = 'table_id_example_' + parameterType;

        // 检查表格是否已经存在，避免重复创建
        if ($('#' + tableId).length) {
            // 如果表格已存在，重新绘制或更新数据
            $('#' + tableId).DataTable().clear().rows.add(dataSet.data).draw();
            return;
        }

        // 创建表格标题
        var tableTitle = `<h3>${parameterType}</h3>`;

        // 创建表格HTML
        var tableHtml = `
        <div style="overflow-x: auto;">
            <table id="${tableId}" class="table table-striped table-bordered display" style="width:100%; margin-bottom: 50px;">
                <thead>
                    <tr id="table_head_${tableId}"></tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    `;

        // 将表格添加到容器中
        $('#tablesContainer').append(tableTitle + tableHtml);

        // 准备列配置
        var columns = [];
        dataSet.keySet.forEach(function(key) {
            $(`#table_head_${tableId}`).append(`<th>${key}</th>`);
            columns.push({ "data": key });
        });

        // 更新 keysSelect 和 keysSelect2（仅基于第一个 parameterType）
        if ($('#tablesContainer').children('h3').length === 1) { // 如果是第一个表格
            $("#keysSelect").empty();
            dataSet.keySet_notime.forEach(function(key) {
                $("#keysSelect").append(`<option value="${key}">${key}</option>`);
            });

            $("#keysSelect2").empty();
            dataSet.keySet_notime.forEach(function(key) {
                $("#keysSelect2").append(`<option value="${key}">${key}</option>`);
            });
        }

        // 初始化 DataTable
        $('#' + tableId).DataTable({
            "scrollX": true,       // 启用水平滚动
            "responsive": false,   // 禁用响应式布局
            "autoWidth": false,    // 禁用自动宽度计算
            columns: columns,
            data: dataSet.data,
            language: {
                url: zh, // 使用 Thymeleaf 传递的语言文件路径
            },
            // 根据需要添加更多的 DataTable 配置项
        });
    }

</script>

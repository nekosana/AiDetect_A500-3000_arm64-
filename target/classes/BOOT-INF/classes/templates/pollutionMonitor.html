<script th:inline="javascript" th:with="zh=@{/json/zh.json}">
    let host = document.location.host;
    function returnKeyData() {
        $.ajaxSettings.async = false;

        $.post("http://" + host +"/returnTrendChart", "monitorName=" + $("#monitorNameSelect").val() + "&keys=" + $("#keysSelect").val(), function (result) {
            // console.log("0000000000"+msg);
            // console.log(result);
            var obj = JSON.parse(result);



            if (obj.qqq != null) {
                confirm(obj.qqq);
            }

            if ($('#lineChart').length) {
                var ctx = document.getElementById("lineChart");

                var lineChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        // labels: ["2023-09-01", "2023-09-02", "2023-09-03", "2023-09-04", "2023-09-05", "2023-09-06", "2023-09-07"],
                        labels: obj.numsTime,
                        datasets: [
                            {
                                label: "数值参数值",
                                backgroundColor: "rgba(38, 185, 154, 0.31)",
                                borderColor: "rgba(38,185,154,0.76)",
                                pointBorderColor: "rgba(38, 185, 154, 0.7)",
                                pointBackgroundColor: "rgba(38, 185, 154, 0.7)",
                                pointHoverBackgroundColor: "#fff",
                                pointHoverBorderColor: "rgba(220,220,220,1)",
                                pointBorderWidth: 1,
                                data: obj.numsData
                            },
                            //     {
                            //     label: "数值参数值",
                            //     backgroundColor: "rgba(3, 88, 106, 0.3)",
                            //     borderColor: "rgba(3, 88, 106, 0.70)",
                            //     pointBorderColor: "rgba(3, 88, 106, 0.70)",
                            //     pointBackgroundColor: "rgba(3, 88, 106, 0.70)",
                            //     pointHoverBackgroundColor: "#fff",
                            //     pointHoverBorderColor: "rgba(151,187,205,1)",
                            //     pointBorderWidth: 3,
                            //     data: [22.92, 22.91, 22.95, 22.94, 22.92, 22.93, 22.91]
                            // }
                        ]
                    },
                });
            }

        });
        $.ajaxSettings.async = true;
    }


    function returnKeyData2() {
        $.ajaxSettings.async = false;
        // history.go(0)
        //重定向

        $.post("http://" + host +"/pollutionAlarm", "&key=" + $("#keysSelect2").val(), function (result) {
            var obj = JSON.parse(result);
            if (obj.qqq != null) {
                confirm(obj.qqq);
            }else {
                window.location.replace("http://" + host +"/pollutionMonitor?key=" + $("#keysSelect2").val())
            }
        });


        // $.post("http://localhost:8082/pollutionAlarm", "&key=" + $("#keysSelect2").val(), function (result) {
        // });

        $.ajaxSettings.async = true;

    }

    function callMonitorName() {
        /*$.post("/returnPollutionMonitorName","",function (result){
            $("#monitorNameSelect").empty();
            for (var i=0;i<result.length;i++){
                $("#monitorNameSelect").append("<option value='"+ result[i] +"'>"+ result[i] +"</option>");
            }
        });*/
        $.ajaxSettings.async = false;
        $.post("http://" + host +"/returnPollutionMonitorName", "", function (result) {
            //218.2.130.246
            $("#monitorNameSelect").empty();
            for (var i = 0; i < result.length; i++) {
                $("#monitorNameSelect").append("<option value='" + result[i] + "'>" + result[i] + "</option>");
            }
        });
        $.ajaxSettings.async = true;
    }


    function callDateDirs() {
        $.ajaxSettings.async = false;
        $.post("http://" + host +"/returnPollutionFileList", "monitorName=" + $("#monitorNameSelect").val(), function (result) {
            //218.2.130.246
            $("#dateDirSelect").empty();
            for (var i = 0; i < result.length; i++) {
                $("#dateDirSelect").append("<option value='" + result[i] + "'>" + result[i] + "</option>");
            }
        });
        $.ajaxSettings.async = true;
    }

    function callPollutionData(cnt) {
        console.log("monitorName=" + $("#monitorNameSelect").val());
        console.log("dir=" + $("#dateDirSelect").val());
        $.post("http://" + host +"/returnPollutionData", "monitorName=" + $("#monitorNameSelect").val() + "&dir=" + $("#dateDirSelect").val() + "&keys=" + $("#keysSelect").val(), function (result) {
            //218.2.130.246:8082
            if (cnt !== 1) {
                $('#table_id_example').DataTable().clear();
                $('#table_id_example').DataTable().destroy();
                $('#table_id_example').empty();
            }
            createDatatable(result);
        });
    }

    function createDatatable(result) {
        var obj = JSON.parse(result);
        var col = [];
        $("#table_id_example").append("<thead>\n" +
            "<tr id=\"table_head\">\n" +
            "</tr>\n" +
            "</thead>");
        for (var i = 0; i < obj.keySet.length; i++) {
            $('#table_head').append("<th>" + obj.keySet[i] + "</th>");
            col[i] = "{\"data\":\"" + obj.keySet[i] + "\"}"
            col[i] = JSON.parse(col[i]);
        }

        $("#keysSelect").empty();
        for (var i = 0; i < obj.keySet_notime.length; i++) {
            $("#keysSelect").append("<option value='" + obj.keySet_notime[i] + "'>" + obj.keySet_notime[i] + "</option>");
        }
        $("#keysSelect2").empty();
        for (var i = 0; i < obj.keySet_notime.length; i++) {
            $("#keysSelect2").append("<option value='" + obj.keySet_notime[i] + "'>" + obj.keySet_notime[i] + "</option>");
        }


        // console.log(col);
        $('#table_id_example').DataTable({
            /*"columns":[  //绑定的数据源，后台的json数据里必须有这些属性，保持一致性
                {"data":"accountNum"},
                {"data":"userName"},
                {"data":"unit"},
                {"data":"authority"},
                {"data":"time"}
            ],*/
            "scrollX": true,
            columns: col,
            data: obj.data,
            language: {
                url: [[${zh}]],
            },
        });
    }

</script>

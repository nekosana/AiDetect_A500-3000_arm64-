<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>智能水质监测系统-修改密码</title>

    <!-- Bootstrap CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!-- bootstrap theme -->
    <link href="css/bootstrap-theme.css" rel="stylesheet">
    <!--external css-->
    <!-- font icon -->
    <link href="css/elegant-icons-style.css" rel="stylesheet" />
    <link href="css/font-awesome.css" rel="stylesheet" />
    <!-- Custom styles -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/style-responsive.css" rel="stylesheet" />

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 -->
    <!--[if lt IE 9]>
    <script src="js/html5shiv.js"></script>
    <script src="js/respond.min.js"></script>
    <![endif]-->
    <script>
        function checkout(){
            var pwd=document.getElementById("input2").value;
            var phone=document.getElementById("input4").value;
            var re_pwd = document.getElementById("input3").value;
            var check = true;

            if (pwd.length<6){
                document.getElementById("hint2").innerHTML="密码不能少于6位！";
                check=false;
            }
            else{
                document.getElementById("hint2").innerHTML="";
            }
            if(re_pwd != pwd){
                document.getElementById("hint3").innerHTML="两次密码输入不同";
                check=false;
            }else{
                document.getElementById("hint3").innerHTML="";
            }
            if (!(/^\d+$/.test(phone))||phone.length!=11||phone[0]!="1"){
                document.getElementById("hint4").innerHTML="请输入正确的11位手机号码！";
                check=false;
            }
            else{
                document.getElementById("hint4").innerHTML="";
            }

            return check;
        }
    </script>

</head>

<body class="login-img3-body">

<div class="container">

    <form id="signup_form" class="mylogin-form" action="updatePwd" onsubmit="return checkout()" enctype="multipart/form-data" method="post">
        <div class="login-wrap">
            <div class="input-group">

                <span>新的密码：</span>
                <input id="input2" type="password" class="form-control" name="password" placeholder="password">
                <p class="hint" id="hint2"></p>

                <span>确认密码：</span>
                <input id="input3" type="password" class="form-control" name="password2" placeholder="password">
                <p class="hint" id="hint3"></p>




            </div>
            <input class="btn btn-primary btn-lg btn-block" type="submit" value="确认提交">
        </div>
    </form>
    <form id="getCode" action="getPhoneCode" method="post" target="form" style="display:none">
        <input type="hidden" name="phone" id="phoneToGetCode">
    </form>
    <iframe name="form" id="form" style="display:none;"></iframe>
</div>

<!-- javascripts -->
<script src="js/jquery.js"></script>
<script src="js/jquery-ui-1.10.4.min.js"></script>
<script src="js/jquery-1.8.3.min.js"></script>
<script type="text/javascript" src="js/jquery-ui-1.9.2.custom.min.js"></script>

<script type="text/javascript" src="js/myjs.js"></script>
<!-- bootstrap -->
<script src="js/bootstrap.js"></script>
<!--script for this page only-->
<script src="js/jquery.rateit.min.js"></script>


<script type="text/javascript">

    $(function(){
        $("#confirm").click(function(event){

            $("#code1").text("重新获取验证码");
            $("#code2").text("60s");
            $("#confirm").attr("disabled",true);
            var date = new Date();
            var now = date.getTime();
            var end = now + 60*1000;
            var s = setInterval(function (){
                var dates =  countTime(end, "code2");
                if(dates<=0) {
                    clearInterval(s);
                    $("#confirm").attr("disabled",false);
                }
            },1000)
            /* event.preventDefault();
           $("#getCode").submit(); */
            $.ajax({
                url:"getPhoneCode",
                type:"POST",
                data:$("#getCode").serialize(),
                success:function(result){
                    alert(result);
                },
                fail:function(result){
                    alert(result);
                }
            })
        })
    })
</script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var msg = [[${msg}]];
    if(msg!=null){
        alert(msg);
    }
    /*]]>*/
</script>
</body>
</html>

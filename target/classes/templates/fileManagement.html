<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" th:href="@{/images/favicon.ico}" type="image/ico"/>

    <title>智能水质监测系统 </title>

    <!-- Bootstrap -->
    <link th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Font Awesome -->
    <link th:href="@{/vendors/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
    <!-- NProgress -->
    <link th:href="@{/vendors/nprogress/nprogress.css}" rel="stylesheet">
    <!-- iCheck -->
    <link th:href="@{/vendors/iCheck/skins/flat/green.css}" rel="stylesheet">

    <!-- bootstrap-progressbar -->

<body class="nav-md">
<div class="container body">
    <div class="main_container">
        <div th:replace="~{blank::menu}"></div>

        <!-- 右上角图标 -->
        <div th:replace="~{blank::top_nav}"></div>
        <!-- /top navigation -->


        <!-- 主页面 -->
        <div class="right_col" role="main">
            <div class="">
                <div class="page-title">
                    <div class="title_left">
                        <h3>文件管理</h3>
                    </div>

                    <div class="title_right">
                    </div>
                </div>

                <div class="clearfix"></div>

                <div class="row">
                    <div class="col-md-12 col-sm-12  ">
                        <div class="x_panel">
                            <div class="x_title">
                                <h2><i class="fa fa-file"></i> 文件管理</h2>
                                <ul class="nav navbar-right panel_toolbox">
                                    <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                                    </li>
                                    <li><a class="close-link"><i class="fa fa-close"></i></a>
                                    </li>
                                </ul>
                                <div class="clearfix"></div>
                            </div>
                            <div class="x_content">

                                <ul class="nav nav-tabs bar_tabs" id="myTab" role="tablist">
                                    <li class="nav-item">
                                        <a class="nav-link " th:classappend="${class} eq 'video'?'active':''" id="home-tab" data-toggle="tab" href="#home"
                                           role="tab" aria-controls="home" th:aria-selected="${class} eq 'video'" onclick="document.getElementById('aaa').value='video'">视频文件</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link"  th:classappend="${class} eq 'data'?'active':''" id="profile-tab" data-toggle="tab" href="#profile"
                                           role="tab" aria-controls="profile" th:aria-selected="${class} eq 'data'" onclick="document.getElementById('aaa').value='data'">数据文件</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link"  th:classappend="${class} eq 'log'?'active':''" id="contact-tab" data-toggle="tab" href="#contact"
                                           role="tab" aria-controls="contact" th:aria-selected="${class} eq 'log'" onclick="document.getElementById('aaa').value='log'">系统日志</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" th:classappend="${class} eq 'upload' ? 'active' : ''" id="upload-tab" data-toggle="tab" href="#upload"
                                           role="tab" aria-controls="upload" th:aria-selected="${class} eq 'upload'" onclick="document.getElementById('aaa').value='upload'">文件上传</a>
                                    </li>
                                </ul>


                                <div class="col-sm-4">
                                    <form th:action="@{${'/returnFile'}}" method="post" id="fileSearch">
                                        <div class="input-group">
                                            <input type="hidden" name="class" id="aaa" th:value="${class}">
                                            <input name="feature" type="search" class="form-control input-sm"
                                                   placeholder="搜索...">
                                            <span class="input-group-btn">
                                <button class="btn btn-default" type="button"
                                        onclick="document.getElementById('fileSearch').submit()">确认</button>
                              </span>

                                        </div>
                                    </form>
                                </div>


                                <div class="tab-content" id="myTabContent">
                                    <div class="tab-pane fade"  th:classappend="${class} eq 'video'?' show active':''" id="home" role="tabpanel"
                                         aria-labelledby="home-tab">
                                        <div class="x_panel">
                                            <div class="x_title">
                                                <h2 th:text="|视频文件总大小:${videoTotalSize}GB|"></h2>
                                                <ul class="nav navbar-right panel_toolbox">
                                                    <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                                                    </li>
                                                    <li><a class="close-link"><i class="fa fa-close"></i></a>
                                                    </li>
                                                </ul>
                                                <div class="clearfix"></div>
                                            </div>

                                            <div class="x_content">
                                                <div class="row">
                                                    <div class="col-sm-12">
                                                        <div class="card-box table-responsive">
                                                            <table id="table_id_example" class="table table-striped table-bordered" style="width:100%">

                                                            </table>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="x_content">
                                                <div class="row">
                                                    <div class="col-sm-12">
                                                        <div class="card-box table-responsive">
                                                            <table id="videoTable"
                                                                   class="table table-striped table-bordered"
                                                                   style="width:100%">
                                                                <thead style="text-align: center">
                                                                <tr>
                                                                    <th>序号</th>
                                                                    <th>文件名</th>
                                                                    <th>文件大小</th>
                                                                    <th>文件路径</th>
                                                                    <th>创建时间</th>
                                                                    <th>操作</th>
                                                                </tr>
                                                                </thead>
                                                                <tbody style="text-align: center">
                                                                <tr th:each="obj,objStat:${videoFileList}">
                                                                    <th style="width: 9%" scope="row"
                                                                        th:text="${objStat.count}">1
                                                                    </th>
                                                                    <td style="width: 22%"
                                                                        th:text="${obj.fileName}"></td>
                                                                    <td style="width: 9%"
                                                                        th:text="${obj.fileSize}"></td>
                                                                    <td style="width: 31%"
                                                                        th:text="${obj.fileSrc}"></td>
                                                                    <td style="width: 20%"
                                                                        th:text="${#dates.format(obj.createdTime,'yyyy年MM月dd日 HH时mm分')}"></td>
                                                                    <td style="width: 9%">
                                                                        <a th:href="@{/download(fileName=${obj.fileName},path=${obj.fileSrc})}"
                                                                           style="color: #33beff">下载</a>
                                                                        <a onclick="return deleteFile()" th:href="@{/deleteOneFile(fileName=${obj.fileName},path=${obj.fileSrc})}"
                                                                           style="color: #33beff">删除</a>
                                                                    </td>
                                                                </tr>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade"  th:classappend="${class} eq 'data'?' show active':''" id="profile" role="tabpanel"
                                         aria-labelledby="profile-tab">
                                        <div class="x_panel">
                                            <div class="x_title">
                                                <h2 th:text="|数据文件总大小:${dataTotalSize}GB|"></h2>
                                                <ul class="nav navbar-right panel_toolbox">
                                                    <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                                                    </li>
                                                    <li><a class="close-link"><i class="fa fa-close"></i></a>
                                                    </li>
                                                </ul>
                                                <div class="clearfix"></div>
                                            </div>
                                            <div class="x_content">
                                                <div class="row">
                                                    <div class="col-sm-12">
                                                        <div class="card-box table-responsive">
                                                            <table id="dataTable"
                                                                   class="table table-striped table-bordered"
                                                                   style="width:100%">
                                                                <thead style="text-align: center">
                                                                <tr>
                                                                    <th>序号</th>
                                                                    <th>文件名</th>
                                                                    <th>文件大小</th>
                                                                    <th>文件路径</th>
                                                                    <th>创建时间</th>
                                                                    <th>操作</th>
                                                                </tr>
                                                                </thead>
                                                                <tbody style="text-align: center">
                                                                <tr th:each="obj,objStat:${dataFileList}">
                                                                    <th scope="row" th:text="${objStat.count}">1</th>
                                                                    <td th:text="${obj.fileName}"></td>
                                                                    <td th:text="${obj.fileSize}"></td>
                                                                    <td th:text="${obj.fileSrc}"></td>
                                                                    <td th:text="${#dates.format(obj.createdTime,'yyyy年MM月dd日 HH时mm分')}"></td>
                                                                    <td>
                                                                        <a th:href="@{/download(fileName=${obj.fileName},path=${obj.fileSrc})}"
                                                                           style="color: #33beff">下载</a>
                                                                        <a onclick="return deleteFile()" th:href="@{/deleteOneFile(fileName=${obj.fileName},path=${obj.fileSrc})}"
                                                                           style="color: #33beff">删除</a>
                                                                    </td>
                                                                </tr>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade"  th:classappend="${class} eq 'log'?' show active':''" id="contact" role="tabpanel"
                                         aria-labelledby="contact-tab">
                                        <div class="x_panel">
                                            <div class="x_title">
                                                <h2 th:text="|日志文件总大小:${logsTotalSize}GB|"></h2>
                                                <ul class="nav navbar-right panel_toolbox">
                                                    <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                                                    </li>
                                                    <li><a class="close-link"><i class="fa fa-close"></i></a>
                                                    </li>
                                                </ul>
                                                <div class="clearfix"></div>
                                            </div>
                                            <div class="x_content">
                                                <div class="row">
                                                    <div class="col-sm-12">
                                                        <div class="card-box table-responsive">
                                                            <table id="logsTable"
                                                                   class="table table-striped table-bordered"
                                                                   style="width:100%">
                                                                <thead style="text-align: center">
<!--                                                                <tr><td th:text="${obj}"></td>-->
                                                                    <th>序号</th>
                                                                    <th>文件名</th>
                                                                    <th>文件大小</th>
                                                                    <th>文件路径</th>
                                                                    <th>创建时间</th>
                                                                    <th>操作</th>
                                                                </tr>
                                                                </thead>
                                                                <tbody style="text-align: center">
                                                                <tr th:each="obj,objStat:${logsFileList}">
                                                                    <th scope="row" th:text="${objStat.count}">1</th>
                                                                    <td th:text="${obj.fileName}"></td>
                                                                    <td th:text="${obj.fileSize}"></td>
                                                                    <td th:text="${obj.fileSrc}"></td>
                                                                    <td th:text="${#dates.format(obj.createdTime,'yyyy年MM月dd日 HH时mm分')}"></td>
                                                                    <td>
                                                                        <a th:href="@{/download(fileName=${obj.fileName},path=${obj.fileSrc})}"
                                                                           style="color: #33beff">下载</a>
                                                                        <a onclick="return deleteFile()" th:href="@{/deleteOneFile(fileName=${obj.fileName},path=${obj.fileSrc})}"
                                                                           style="color: #33beff">删除</a>
                                                                    </td>
                                                                </tr>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" th:classappend="${class} eq 'upload' ? ' show active' : ''" id="upload" role="tabpanel" aria-labelledby="upload-tab">
                                        <div class="x_panel">
                                            <div class="x_title">
                                                <h2>文件上传</h2>
                                                <ul class="nav navbar-right panel_toolbox">
                                                    <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a></li>
                                                    <li><a class="close-link"><i class="fa fa-close"></i></a></li>
                                                </ul>
                                                <div class="clearfix"></div>
                                            </div>
                                            <div class="x_content">
                                                <!-- 文件上传表单或相关内容 -->
                                                <form action="/uploadFile" method="post" enctype="multipart/form-data">
                                                    <div class="form-group">
                                                        <label for="fileInput">选择文件</label>
                                                        <input type="file" class="form-control-file" id="fileInput" name="file">
                                                    </div>
                                                    <div class="form-group">
                                                        <label for="ipInput">IP地址</label>
                                                        <input type="text" class="form-control" id="ipInput" name="ip" placeholder="请输入IP地址">
                                                    </div>
                                                    <div class="form-group">
                                                        <label for="portInput">端口</label>
                                                        <input type="number" class="form-control" id="portInput" name="port" placeholder="请输入端口号">
                                                    </div>
                                                    <button type="submit" class="btn btn-primary">上传文件</button>
                                                    <button type="button" class="btn btn-secondary" onclick="resetForm()">取消</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="clearfix"></div>
            </div>
            <!-- 主页面结束 -->


            <!-- footer content 页脚：可以指代开发公司？-->

            <!--          <div class="pull-middle">-->
            <!--            Gentelella - Bootstrap Admin Template by <a th:href="@{/https://colorlib.com">Colorlib</a>-->
            <!--          </div>-->

            <!--        </footer>-->
            <!-- /footer content -->
        </div>
        <!-- 主页面结束 -->


        <!-- footer content 页脚：可以指代开发公司？-->
        <!--        <footer>-->
        <!--          <div class="pull-middle">-->

        <!--          </div>-->

        <!-- /footer content -->
    </div>
</div>

<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

<script th:src="@{/vendors/Flot/jquery.flot.js}"></script>

<script type="text/javascript">
    function resetForm() {
        // 这里可以通过JavaScript清除表单，或者导航到其他页面
        // 例如，重置表单输入:
        document.getElementById('fileInput').value = '';
        document.getElementById('ipInput').value = '';
        document.getElementById('portInput').value = '';

    }
</script>
<!-- Custom Theme Scripts -->
<script th:src="@{/build/js/custom.min.js}"></script>
<script type="text/javascript" th:inline="javascript">
    $(function () {
        $("#pageSize").change(function () {
            let feature =/*[[${feature}]]*/'';
            if (feature != null && feature != '') {
                feature = '/' + feature;
            } else {
                feature = '';
            }
            console.log(feature);
            $("#pageSizeForm").attr({'action': $("#pageSizeForm").attr('action') + $("#pageSize option:selected").val() + feature})
            console.log($("#pageSizeForm").attr('action'));
            $("#pageSizeForm").submit();
        });
    });
</script>
<script th:inline="javascript">
    /*<![CDATA[*/
    $(function () {
        var msg = /*[[${msg}]]*/null;
        if (msg != null) {
            alert(msg);
        }
    })
    /*]]>*/
</script>

<script type="text/javascript" th:inline="javascript">
    function deleteFile() {
        const r = confirm("确定删除此文件？");
        if (r) {
            // alert("文件删除成功");
            return true;
        }
        return false;
    }
</script>
